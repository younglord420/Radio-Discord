services:
  discord-radio:
    build: .
    container_name: discord-radio
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: /app/data/radio.db
      LOG_PRETTY: "0"
    volumes:
      - radio-data:/app/data
    mem_limit: 512m
    cpus: 1.0

volumes:
  radio-data:
